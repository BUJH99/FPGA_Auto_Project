        function toNumber(raw) {
          if (raw === null || raw === undefined) return null;
          const normalized = String(raw).replace(/,/g, "").trim();
          if (!normalized) return null;
          const value = Number(normalized);
          return Number.isFinite(value) ? value : null;
        }

        function findMetricValue(text, labelRegex) {
          const lines = text.split(/\r?\n/);
          for (const line of lines) {
            const matched = line.match(labelRegex);
            if (!matched || matched.index === undefined) continue;
            const tail = line.slice(matched.index + matched[0].length);
            const numberMatch = tail.match(/[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/);
            if (numberMatch) return toNumber(numberMatch[0]);
          }
          return null;
        }

        function findMetricText(text, labelRegex) {
          const lines = text.split(/\r?\n/);
          for (const line of lines) {
            const matched = line.match(labelRegex);
            if (!matched || matched.index === undefined) continue;
            const tail = line
              .slice(matched.index + matched[0].length)
              .replace(/[|:=]/g, " ")
              .trim();
            if (!tail) continue;
            const pieces = tail.split(/\s{2,}/).filter(Boolean);
            return (pieces[0] || tail).trim();
          }
          return "";
        }

        function findMetricNumbers(text, labelRegex) {
          const lines = text.split(/\r?\n/);
          for (const line of lines) {
            const matched = line.match(labelRegex);
            if (!matched || matched.index === undefined) continue;
            const tail = line.slice(matched.index + matched[0].length);
            const numberMatches = tail.match(/[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?/g);
            if (!numberMatches || numberMatches.length === 0) continue;
            return numberMatches.map((raw) => toNumber(raw)).filter((v) => v !== null);
          }
          return [];
        }

        function parseUtilRow(text, labelRegex) {
          const numbers = findMetricNumbers(text, labelRegex);
          const used = numbers.length > 0 ? numbers[0] : null;
          const available = numbers.length > 1 ? numbers[1] : null;
          let percent = numbers.length > 2 ? numbers[2] : percentOf(used, available);
          return { used, available, percent };
        }

        function normalizeUtilLabel(rawLabel) {
          return String(rawLabel || "")
            .replace(/\*/g, "")
            .replace(/\s+/g, " ")
            .trim();
        }

        function parseUtilTableRows(text) {
          const lines = text.split(/\r?\n/);
          const parsedRows = [];
          let insideSiteTypeTable = false;

          for (const line of lines) {
            if (
              /\|\s*Site Type\s*\|/i.test(line) &&
              /\|\s*Used\s*\|/i.test(line) &&
              /\|\s*Available\s*\|/i.test(line) &&
              /\|\s*Util%?\s*\|/i.test(line)
            ) {
              insideSiteTypeTable = true;
              continue;
            }

            if (!insideSiteTypeTable) continue;

            const trimmedLine = line.trim();
            if (!trimmedLine) {
              insideSiteTypeTable = false;
              continue;
            }

            if (!line.includes("|")) continue;
            if (/^\+-+/.test(trimmedLine)) continue;

            const rawCells = line.split("|").slice(1, -1);
            if (rawCells.length < 6) continue;

            const rawLabelCell = rawCells[0];
            const label = normalizeUtilLabel(rawLabelCell);
            if (!label || /^site\s*type$/i.test(label)) continue;

            const used = toNumber(rawCells[1]);
            const available = toNumber(rawCells[4]);
            const percentRaw = toNumber(rawCells[5]);
            const percent = Number.isFinite(percentRaw) ? percentRaw : percentOf(used, available);

            if (used === null && available === null && percent === null) continue;

            parsedRows.push({
              label,
              used,
              available,
              percent
            });
          }

          const dedupedRows = [];
          const seenLabels = new Set();
          for (const row of parsedRows) {
            const key = row.label.toLowerCase();
            if (seenLabels.has(key)) continue;
            seenLabels.add(key);
            dedupedRows.push(row);
          }
          return dedupedRows;
        }

        function findUtilRow(rows, labelRegex) {
          for (const row of rows || []) {
            if (!row || !row.label) continue;
            if (labelRegex.test(row.label)) return row;
          }
          return null;
        }

        function parsePowerReport(text) {
          return {
            totalOnChipPowerW: findMetricValue(text, /Total\s+On[- ]Chip\s+Power/i),
            dynamicPowerW: findMetricValue(text, /(?:Total\s+)?Dynamic(?:\s+On[- ]Chip)?(?:\s+Power)?\b/i),
            staticPowerW: findMetricValue(text, /(?:Device\s+)?Static(?:\s+Power)?\b/i),
            clocksW: findMetricValue(text, /Clocks?\b/i),
            signalsW: findMetricValue(text, /Signals?\b/i),
            logicW: findMetricValue(text, /Logic\b/i),
            bramW: findMetricValue(text, /BRAM\b/i),
            pllW: findMetricValue(text, /PLL\b/i),
            ioW: findMetricValue(text, /(?:I\/O|IO)\b/i),
            junctionTempC: findMetricValue(text, /Junction\s+Temperature/i),
            thermalMarginC: findMetricValue(text, /Thermal\s+Margin/i),
            confidenceLevel: findMetricText(text, /Confidence\s+Level/i)
          };
        }

        function parseTimingReport(text) {
          return {
            wnsNs: findMetricValue(text, /\bWNS(?:\s*\(ns\))?\b/i),
            tnsNs: findMetricValue(text, /\bTNS(?:\s*\(ns\))?\b/i),
            whsNs: findMetricValue(text, /\bWHS(?:\s*\(ns\))?\b/i),
            thsNs: findMetricValue(text, /\bTHS(?:\s*\(ns\))?\b/i),
            wpwsNs: findMetricValue(text, /\bWPWS(?:\s*\(ns\))?\b/i),
            tpwsNs: findMetricValue(text, /\bTPWS(?:\s*\(ns\))?\b/i),
            failingEndpoints: findMetricValue(text, /Failing\s+Endpoints/i),
            totalEndpoints: findMetricValue(text, /Total\s+Endpoints/i)
          };
        }

        function parseUtilReport(text) {
          const utilResources = parseUtilTableRows(text);
          const lutFromRows = findUtilRow(utilResources, /\b(?:slice\s+luts?|luts?)\b/i);
          const ffFromRows = findUtilRow(utilResources, /\b(?:slice\s+registers?|registers?|ff)\b/i);
          const ioFromRows = findUtilRow(utilResources, /\b(?:bonded\s+iobs?|i\/o|io)\b/i);
          const bufgFromRows = findUtilRow(utilResources, /\b(?:bufgctrl|bufg)\b/i);

          const lut = lutFromRows || parseUtilRow(text, /(?:^|[|\s])(?:Slice\s+LUTs?|LUT)\b(?!RAM)/i);
          const ff = ffFromRows || parseUtilRow(text, /(?:^|[|\s])(?:Slice\s+Registers?|FF)\b/i);
          const io = ioFromRows || parseUtilRow(text, /(?:^|[|\s])(?:Bonded\s+IOBs?|I\/O|IO)\b/i);
          const bufg = bufgFromRows || parseUtilRow(text, /(?:^|[|\s])BUFG(?:CTRL)?s?\b/i);

          return {
            lutUsed: lut.used,
            lutAvailable: lut.available,
            lutPct: lut.percent,
            ffUsed: ff.used,
            ffAvailable: ff.available,
            ffPct: ff.percent,
            ioUsed: io.used,
            ioAvailable: io.available,
            ioPct: io.percent,
            bufgUsed: bufg.used,
            bufgAvailable: bufg.available,
            bufgPct: bufg.percent,
            utilResources,
            // Backward-compatible keys
            sliceLuts: lut.used,
            sliceRegisters: ff.used,
            bondedIob: io.used,
            bufg: bufg.used
          };
        }

        function formatMetric(value, unit = "", digits = 3) {
          if (value === null || value === undefined || Number.isNaN(value)) return "-";
          const text = Number(value).toFixed(digits);
          return unit ? `${text} ${unit}` : text;
        }

        function formatCount(value) {
          if (value === null || value === undefined || Number.isNaN(value)) return "-";
          return String(Math.round(value));
        }

        function percentOf(part, total) {
          if (
            part === null ||
            part === undefined ||
            total === null ||
            total === undefined ||
            Number.isNaN(part) ||
            Number.isNaN(total) ||
            Number(total) <= 0
          ) {
            return null;
          }
          const raw = (Number(part) / Number(total)) * 100;
          return Math.max(0, Math.min(100, raw));
        }

        function getSlackStatus(value) {
          if (value === null || value === undefined || Number.isNaN(value)) {
            return { text: "N/A", className: "na" };
          }
          if (value >= 0) return { text: "Met", className: "met" };
          return { text: "Violation", className: "bad" };
        }

        function getFailEndpointStatus(value) {
          if (value === null || value === undefined || Number.isNaN(value)) {
            return { text: "N/A", className: "na" };
          }
          if (value === 0) return { text: "Clean", className: "met" };
          return { text: "Fail", className: "bad" };
        }

        function renderReportRow(metric, value, status) {
          return `
            <tr>
              <td>${escapeHtml(metric)}</td>
              <td class="report-value">${escapeHtml(value)}</td>
              <td><span class="status-chip ${escapeHtml(status.className)}">${escapeHtml(status.text)}</span></td>
            </tr>
          `;
        }

        function renderPowerReport(target, parsed, sourcePath) {
          const safeDynamic = Number.isFinite(parsed.dynamicPowerW) ? parsed.dynamicPowerW : null;
          const safeStatic = Number.isFinite(parsed.staticPowerW) ? parsed.staticPowerW : null;
          const derivedTotal =
            (safeDynamic !== null ? safeDynamic : 0) + (safeStatic !== null ? safeStatic : 0);
          const safeTotal =
            Number.isFinite(parsed.totalOnChipPowerW) && parsed.totalOnChipPowerW > 0
              ? parsed.totalOnChipPowerW
              : derivedTotal > 0
                ? derivedTotal
                : null;

          const powerParts = [
            { key: "clocksW", label: "Clocks", css: "power-part-clocks", fallbackRatio: 0.08 },
            { key: "signalsW", label: "Signals", css: "power-part-signals", fallbackRatio: 0.02 },
            { key: "logicW", label: "Logic", css: "power-part-logic", fallbackRatio: 0.02 },
            { key: "bramW", label: "BRAM", css: "power-part-bram", fallbackRatio: 0.01 },
            { key: "pllW", label: "PLL", css: "power-part-pll", fallbackRatio: 0.86 },
            { key: "ioW", label: "I/O", css: "power-part-io", fallbackRatio: 0.01 }
          ];

          let dynamicPartItems = powerParts.map((item) => ({
            ...item,
            value: Number.isFinite(parsed[item.key]) ? parsed[item.key] : null
          }));

          const explicitPartSum = dynamicPartItems.reduce(
            (sum, item) => sum + (item.value !== null ? item.value : 0),
            0
          );
          const hasExplicitParts = explicitPartSum > 0;
          const dynamicBase =
            safeDynamic !== null && safeDynamic > 0
              ? safeDynamic
              : hasExplicitParts
                ? explicitPartSum
                : null;

          if (!hasExplicitParts && dynamicBase !== null && dynamicBase > 0) {
            dynamicPartItems = dynamicPartItems.map((item) => ({
              ...item,
              value: dynamicBase * item.fallbackRatio
            }));
          }

          const dynamicPct = percentOf(safeDynamic, safeTotal);
          const staticPct = percentOf(safeStatic, safeTotal);
          const mainDynamicPct = dynamicPct !== null ? dynamicPct : safeStatic !== null ? Math.max(0, 100 - (staticPct || 0)) : 42;
          const mainStaticPct = staticPct !== null ? staticPct : Math.max(0, 100 - mainDynamicPct);

          const dynamicSegmentsHtml = dynamicPartItems
            .map((item) => {
              const pct = percentOf(item.value, dynamicBase);
              if (pct === null || pct <= 0) return "";
              return `<div class="power-segment ${item.css}" style="height:${pct.toFixed(2)}%"></div>`;
            })
            .join("");

          const legendRowsHtml = dynamicPartItems
            .map((item) => {
              const pct = percentOf(item.value, dynamicBase);
              const pctText = pct === null ? "-" : `${Math.round(pct)}%`;
              return `
                <div class="power-legend-row">
                  <span class="power-dot ${item.css}"></span>
                  <span class="power-legend-name">${escapeHtml(item.label)}:</span>
                  <span class="power-legend-value">${escapeHtml(formatMetric(item.value, "W"))}</span>
                  <span class="power-legend-pct">(${escapeHtml(pctText)})</span>
                </div>
              `;
            })
            .join("");

          target.innerHTML = `
            <div class="power-visual">
              <p class="power-visual-title">On-Chip Power</p>
              <div class="power-visual-layout">
                <div class="power-stack">
                  <div class="power-segment power-main-static" style="height:${mainStaticPct.toFixed(2)}%">
                    <span class="power-segment-label">${Math.round(mainStaticPct)}%</span>
                  </div>
                  <div class="power-segment power-main-dynamic" style="height:${mainDynamicPct.toFixed(2)}%">
                    <span class="power-segment-label">${Math.round(mainDynamicPct)}%</span>
                  </div>
                </div>
                <div class="power-stack">
                  ${dynamicSegmentsHtml}
                </div>
                <div class="power-legend">
                  <div class="power-legend-row">
                    <span class="power-dot power-main-dynamic"></span>
                    <span class="power-legend-name">Dynamic:</span>
                    <span class="power-legend-value">${escapeHtml(formatMetric(safeDynamic, "W"))}</span>
                    <span class="power-legend-pct">(${escapeHtml(dynamicPct === null ? "-" : `${Math.round(dynamicPct)}%`)})</span>
                  </div>
                  ${legendRowsHtml}
                </div>
              </div>
              <div class="power-static-row">
                <span class="power-dot power-main-static"></span>
                <span class="power-legend-name">Device Static:</span>
                <span class="power-legend-value">${escapeHtml(formatMetric(safeStatic, "W"))}</span>
                <span class="power-legend-pct">(${escapeHtml(staticPct === null ? "-" : `${Math.round(staticPct)}%`)})</span>
              </div>
            </div>
          `;
        }

        function renderTimingReport(target, parsed, sourcePath) {
          const kpiItems = [
            { label: "WNS (setup)", value: formatMetric(parsed.wnsNs, "ns"), status: getSlackStatus(parsed.wnsNs) },
            { label: "TNS (setup)", value: formatMetric(parsed.tnsNs, "ns"), status: getSlackStatus(parsed.tnsNs) },
            { label: "WHS (hold)", value: formatMetric(parsed.whsNs, "ns"), status: getSlackStatus(parsed.whsNs) },
            { label: "THS (hold)", value: formatMetric(parsed.thsNs, "ns"), status: getSlackStatus(parsed.thsNs) },
            { label: "WPWS (pulse)", value: formatMetric(parsed.wpwsNs, "ns"), status: getSlackStatus(parsed.wpwsNs) },
            { label: "TPWS (pulse)", value: formatMetric(parsed.tpwsNs, "ns"), status: getSlackStatus(parsed.tpwsNs) },
            {
              label: "Failing Endpoints",
              value: formatCount(parsed.failingEndpoints),
              status: getFailEndpointStatus(parsed.failingEndpoints)
            },
            {
              label: "Total Endpoints",
              value: formatCount(parsed.totalEndpoints),
              status: {
                text: parsed.totalEndpoints === null ? "N/A" : "Read",
                className: parsed.totalEndpoints === null ? "na" : "met"
              }
            }
          ];

          const kpiHtml = kpiItems
            .map(
              (item) => `
                <div class="timing-kpi">
                  <span class="timing-kpi-label">${escapeHtml(item.label)}</span>
                  <span class="timing-kpi-value">${escapeHtml(item.value)}</span>
                  <span class="timing-kpi-status ${escapeHtml(item.status.className)}">${escapeHtml(item.status.text)}</span>
                </div>
              `
            )
            .join("");

          target.innerHTML = `
            <div class="timing-kpi-grid">${kpiHtml}</div>
          `;
        }

        function compactUtilLabel(label) {
          const normalized = normalizeUtilLabel(label);
          const lower = normalized.toLowerCase();

          if ((/\bslice\s+luts?\b/.test(lower) || /^luts?$/.test(lower)) && !/lutram/.test(lower)) {
            return "LUT";
          }
          if (/\bslice\s+registers?\b/.test(lower) || /^ff$/.test(lower) || /flip\s*flop/.test(lower)) {
            return "FF";
          }
          if (/block\s+ram|ramb/.test(lower)) return "BRAM";
          if (/^dsp/.test(lower)) return "DSP";
          if (/bonded\s+iob|(^|[\s/_-])i\/?o($|[\s/_-])/.test(lower)) return "IO";
          if (/bufg/.test(lower)) return "BUFG";
          if (/mmcm/.test(lower)) return "MMCM";
          if (/pll/.test(lower)) return "PLL";

          const tokens = normalized
            .replace(/[^A-Za-z0-9/_-]+/g, " ")
            .split(/\s+/)
            .filter(Boolean);
          if (!tokens.length) return "-";
          if (tokens.length === 1) return tokens[0].toUpperCase().slice(0, 7);

          const acronym = tokens.map((token) => token[0]).join("").toUpperCase();
          return acronym.slice(0, 7) || tokens[0].toUpperCase().slice(0, 7);
        }

        function renderUtilReport(target, parsed, sourcePath) {
          const fallbackResources = [
            {
              label: "LUT",
              used: Number.isFinite(parsed.lutUsed) ? parsed.lutUsed : parsed.sliceLuts,
              available: parsed.lutAvailable,
              percent: parsed.lutPct
            },
            {
              label: "FF",
              used: Number.isFinite(parsed.ffUsed) ? parsed.ffUsed : parsed.sliceRegisters,
              available: parsed.ffAvailable,
              percent: parsed.ffPct
            },
            {
              label: "IO",
              used: Number.isFinite(parsed.ioUsed) ? parsed.ioUsed : parsed.bondedIob,
              available: parsed.ioAvailable,
              percent: parsed.ioPct
            },
            {
              label: "BUFG",
              used: Number.isFinite(parsed.bufgUsed) ? parsed.bufgUsed : parsed.bufg,
              available: parsed.bufgAvailable,
              percent: parsed.bufgPct
            }
          ];

          const dynamicResources =
            Array.isArray(parsed.utilResources) && parsed.utilResources.length > 0
              ? parsed.utilResources
              : [];
          const baseResources = dynamicResources.length > 0 ? dynamicResources : fallbackResources;

          let normalized = baseResources
            .map((item) => {
              const label = normalizeUtilLabel(item?.label || "");
              const used = Number.isFinite(item?.used) ? item.used : null;
              const available = Number.isFinite(item?.available) ? item.available : null;
              const percentRaw = Number.isFinite(item?.percent) ? item.percent : percentOf(used, available);
              const percent =
                percentRaw === null || Number.isNaN(percentRaw)
                  ? null
                  : Math.max(0, Math.min(100, percentRaw));
              const percentText =
                percent === null ? "-" : `${percent.toFixed(percent < 10 ? 2 : 1).replace(/\.0$/, "")}%`;

              return {
                label,
                chartLabel: compactUtilLabel(label),
                used,
                available,
                percent,
                percentText
              };
            })
            .filter(
              (item) =>
                item.label &&
                (item.used !== null || item.available !== null || item.percent !== null)
            );

          if (normalized.length === 0) {
            normalized = fallbackResources.map((item) => {
              const used = Number.isFinite(item.used) ? item.used : null;
              const available = Number.isFinite(item.available) ? item.available : null;
              const percentRaw = Number.isFinite(item.percent) ? item.percent : percentOf(used, available);
              const percent =
                percentRaw === null || Number.isNaN(percentRaw)
                  ? null
                  : Math.max(0, Math.min(100, percentRaw));
              const percentText =
                percent === null ? "-" : `${percent.toFixed(percent < 10 ? 2 : 1).replace(/\.0$/, "")}%`;
              const label = normalizeUtilLabel(item.label);
              return {
                label,
                chartLabel: compactUtilLabel(label),
                used,
                available,
                percent,
                percentText
              };
            });
          }

          const maxVisibleResources = 14;
          const visibleResources = normalized.slice(0, maxVisibleResources);
          const visibleCount = Math.max(1, visibleResources.length);
          const densityRatio = (visibleCount - 1) / (maxVisibleResources - 1);
          const lerp = (max, min) => max - (max - min) * densityRatio;
          const roundPx = (value) => `${Math.max(0, value).toFixed(2)}px`;
          const roundNum = (value) => Math.max(0, value).toFixed(2);

          const layoutStyle = [
            `--util-panel-pad:${roundPx(lerp(9, 4.5))}`,
            `--util-label-col:${roundPx(lerp(38, 24))}`,
            `--util-row-gap:${roundPx(lerp(6, 1))}`,
            `--util-chart-label-size:${roundPx(lerp(12, 8))}`,
            `--util-track-height:${roundPx(lerp(22, 10))}`,
            `--util-pct-size:${roundPx(lerp(12, 8))}`,
            `--util-pct-min-width:${roundPx(lerp(44, 26))}`,
            `--util-axis-gap:${roundPx(lerp(5, 1))}`,
            `--util-axis-size:${roundPx(lerp(11, 7))}`,
            `--util-axis-title-gap:${roundPx(lerp(5, 1))}`,
            `--util-axis-title-size:${roundPx(lerp(12, 8))}`,
            `--util-table-font-size:${roundPx(lerp(10, 6.5))}`,
            `--util-table-line-height:${roundNum(lerp(1.28, 1.05))}`,
            `--util-table-pad-y:${roundPx(lerp(4, 1))}`,
            `--util-table-pad-x:${roundPx(lerp(5, 2))}`
          ].join(";");

          const barRowsHtml = visibleResources
            .map(
              (item) => `
                <div class="util-chart-row">
                  <span class="util-chart-label" title="${escapeHtml(item.label)}">${escapeHtml(item.chartLabel)}</span>
                  <div class="util-bar-line">
                    <div class="util-bar-track">
                      <div class="util-bar-fill" style="width:${item.percent === null ? 0 : item.percent.toFixed(2)}%"></div>
                    </div>
                    <span class="util-bar-pct">${escapeHtml(item.percentText)}</span>
                  </div>
                </div>
              `
            )
            .join("");

          const tableRowsHtml = visibleResources
            .map(
              (item) => `
                <tr>
                  <td title="${escapeHtml(item.label)}">${escapeHtml(item.label)}</td>
                  <td class="num">${escapeHtml(formatCount(item.used))}</td>
                  <td class="num">${escapeHtml(formatCount(item.available))}</td>
                  <td class="num">${escapeHtml(item.percentText)}</td>
                </tr>
              `
            )
            .join("");

          target.innerHTML = `
            <div class="util-report-layout" style="${layoutStyle}">
              <div class="util-chart-panel">
                ${barRowsHtml}
                <div class="util-axis">
                  <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
                </div>
                <div class="util-axis-title">Estimated Utilization (%)</div>
              </div>
              <div class="util-count-panel">
                <div class="util-table-wrap">
                  <table class="util-table">
                    <thead>
                      <tr>
                        <th>Resource</th>
                        <th>Utilization</th>
                        <th>Available</th>
                        <th>Utilization %</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${tableRowsHtml}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          `;
        }

        function renderReportLoadError(target, sourcePath, errorText) {
          target.innerHTML = `
            <p class="report-error">
              파일 로드 실패: ${escapeHtml(sourcePath || "(경로 미지정)")}
            </p>
            <div class="report-helper">
              ${escapeHtml(errorText || "브라우저에서 .rpt 파일을 읽지 못했습니다.")}
              <br />
              로컬 파일 직접 열기(file://) 환경에서는 fetch가 차단될 수 있으니, 로컬 서버로 실행하거나 경로를 확인하세요.
            </div>
          `;
        }

        function renderReportPreviewHint(target, sourcePath, errorText) {
          target.insertAdjacentHTML(
            "afterbegin",
            `
              <div class="report-helper" style="margin-bottom:8px;">
                파일 로드 실패로 예시 데이터(Preview)를 표시 중입니다.
                <br />
                Source: ${escapeHtml(sourcePath || "(경로 미지정)")}, Error: ${escapeHtml(errorText || "-")}
              </div>
            `
          );
        }

        async function fetchTextReport(path) {
          if (!path || !String(path).trim()) {
            return { ok: false, error: "리포트 경로가 비어 있습니다." };
          }

          try {
            const response = await fetch(path, { cache: "no-store" });
            if (!response.ok) {
              return { ok: false, error: `HTTP ${response.status}` };
            }
            const text = await response.text();
            return { ok: true, text };
          } catch (error) {
            return { ok: false, error: error?.message || "알 수 없는 로드 오류" };
          }
        }

        async function loadVivadoReports(config) {
          const powerTarget = document.getElementById("power-report-view");
          const timingTarget = document.getElementById("timing-report-view");
          const utilTarget = document.getElementById("util-report-view");
          if (!powerTarget || !timingTarget || !utilTarget) return;

          const powerPath = config.assets?.powerReportRpt || "";
          const timingPath = config.assets?.timingReportRpt || "";
          const utilPath = config.assets?.utilReportRpt || "";
          const previewEnabled = config.reportPreview?.enableOnLoadFail !== false;
          const previewPower = config.reportPreview?.power || {
            totalOnChipPowerW: 0.421,
            dynamicPowerW: 0.176,
            staticPowerW: 0.245,
            clocksW: 0.013,
            signalsW: 0.004,
            logicW: 0.003,
            bramW: 0.001,
            pllW: 0.150,
            ioW: 0.005,
            junctionTempC: 25.5,
            thermalMarginC: 59.5,
            confidenceLevel: "Medium"
          };
          const previewTiming = config.reportPreview?.timing || {
            wnsNs: 3.028,
            tnsNs: 0.0,
            whsNs: 0.066,
            thsNs: 0.0,
            wpwsNs: 0.820,
            tpwsNs: 0.0,
            failingEndpoints: 0,
            totalEndpoints: 128
          };
          const previewUtil = config.reportPreview?.util || defaultUtilPreview;

          const [powerLoaded, timingLoaded, utilLoaded] = await Promise.all([
            fetchTextReport(powerPath),
            fetchTextReport(timingPath),
            fetchTextReport(utilPath)
          ]);

          if (powerLoaded.ok) {
            const parsedPower = parsePowerReport(powerLoaded.text);
            renderPowerReport(powerTarget, parsedPower, powerPath);
          } else {
            const fallbackPower = previewEnabled ? previewPower : {};
            renderPowerReport(powerTarget, fallbackPower, "");
          }

          if (timingLoaded.ok) {
            const parsedTiming = parseTimingReport(timingLoaded.text);
            renderTimingReport(timingTarget, parsedTiming, timingPath);
          } else {
            const fallbackTiming = previewEnabled ? previewTiming : {};
            renderTimingReport(timingTarget, fallbackTiming, "");
          }

          if (utilLoaded.ok) {
            const parsedUtil = parseUtilReport(utilLoaded.text);
            renderUtilReport(utilTarget, parsedUtil, utilPath);
          } else {
            const fallbackUtil = previewEnabled ? previewUtil : {};
            renderUtilReport(utilTarget, fallbackUtil, "");
          }
        }

        function bindImageFallback() {
          document.querySelectorAll(".media-box img").forEach((img) => {
            img.addEventListener("error", () => {
              const box = img.closest(".media-box");
              if (!box) return;
              box.classList.add("is-empty");
            });
          });
        }

        const slidesRoot = document.getElementById("slides-root");
        slidesRoot.innerHTML = buildSlides(presentationConfig);
        bindImageFallback();
        loadVivadoReports(presentationConfig);

        const deck = new Reveal({
          hash: true,
          controls: true,
          progress: true,
          center: false,
          width: 1000,
          height: 700,
          margin: 0.04,
          slideNumber: "c/t",
          transition: "slide",
          backgroundTransition: "fade"
        });

        deck.initialize();
      })();
    </script>
  </body>
</html>
