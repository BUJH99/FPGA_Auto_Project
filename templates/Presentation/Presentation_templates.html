<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>발표자료 자동화 템플릿 (reveal.js)</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css"
    />
    <style>
      :root {
        --bg-body: #e0e0e0;
        --bg-slide: #ffffff;
        --bg-light: #f4f4f5;
        --text-primary: #000000;
        --text-secondary: #52525b;
        --border-thick: 3px solid #000000;
        --primary-brand: #2563eb;
        --shadow-hard: 6px 6px 0 rgba(0, 0, 0, 1);
        --shadow-slide: 0 20px 40px rgba(0, 0, 0, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg-body);
      }

      .reveal {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        color: var(--text-primary);
        font-size: 24px;
      }

      .reveal .slides {
        text-align: left;
      }

      .reveal .slides section {
        padding: 0;
        height: 100%;
      }

      .slide-frame {
        width: 100%;
        height: 100%;
        background: var(--bg-slide);
        border: var(--border-thick);
        box-shadow: var(--shadow-slide);
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 50px 60px;
        overflow: hidden;
      }

      .slide-frame.cover-slide {
        justify-content: center;
      }

      .cover-container {
        border: 4px solid black;
        height: 100%;
        width: 100%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-shadow: 10px 10px 0 #eeeeee;
      }

      .cover-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .cover-logo-text {
        font-family: monospace;
        font-size: 14px;
        font-weight: 700;
        color: var(--primary-brand);
        letter-spacing: 0.4px;
      }

      .cover-logo-circle {
        width: 52px;
        height: 52px;
        background: var(--primary-brand);
        border-radius: 999px;
      }

      .reveal .cover-title {
        margin: 0 0 18px 0;
        font-size: 50px;
        line-height: 0.96;
        letter-spacing: -1px;
        font-weight: 900;
      }

      .cover-divider {
        width: 160px;
        height: 10px;
        background: black;
        margin-bottom: 16px;
      }

      .reveal .cover-subtitle {
        margin: 0;
        font-size: 18px;
        color: #333333;
        font-weight: 700;
      }

      .reveal .cover-footer {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 13px;
        color: #666666;
      }

      .reveal .chapter-number {
        position: absolute;
        right: 60px;
        top: 40px;
        z-index: 0;
        font-size: 48px;
        font-weight: 900;
        line-height: 0.8;
        color: var(--bg-light);
        -webkit-text-stroke: 2px black;
      }

      .slide-header {
        margin-bottom: 16px;
        border-bottom: 4px solid black;
        padding-bottom: 12px;
        z-index: 1;
      }

      .reveal .chapter-tag {
        display: inline-block;
        margin-bottom: 8px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 800;
        background: black;
        color: white;
        letter-spacing: 0.6px;
      }

      .reveal .slide-frame h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -0.6px;
        position: relative;
      }

      .reveal .slide-frame h3 {
        margin: 0 0 12px 0;
        font-size: 16px;
        font-weight: 800;
        border-left: 5px solid var(--primary-brand);
        padding-left: 10px;
      }

      .reveal .slide-frame p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .reveal .slide-frame ul,
      .reveal .slide-frame ol {
        margin: 0;
        padding-left: 20px;
        color: var(--text-secondary);
        font-size: 13px;
      }

      .reveal .slide-frame li {
        margin-bottom: 6px;
        line-height: 1.42;
        font-weight: 500;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        min-height: 0;
      }

      .col-flex {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 0;
      }

      .toc-card-large {
        flex: 1;
        padding: 24px;
      }

      .toc-card-large ol {
        column-count: 2;
        column-gap: 36px;
        font-size: 14px;
      }

      .toc-card-large li {
        break-inside: avoid;
      }

      .card {
        border: 2px solid black;
        background: white;
        padding: 18px;
        box-shadow: var(--shadow-hard);
      }

      .diagram-blank-slot {
        min-height: 220px;
      }

      .card.plain {
        border: none;
        box-shadow: none;
        background: transparent;
        padding: 0;
      }

      .card.accent {
        background: var(--primary-brand);
        color: white;
      }

      .card.accent h3 {
        border-left-color: white;
        color: white;
      }

      .card.accent p,
      .card.accent li {
        color: rgba(255, 255, 255, 0.95);
      }

      .feature-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .feature-item {
        border: 2px solid black;
        background: #fafafa;
        padding: 12px;
      }

      .feature-item strong {
        font-size: 14px;
      }

      .feature-item p {
        margin-top: 6px;
        font-size: 13px;
      }

      .media-box {
        width: 100%;
        height: 320px;
        border: 2px solid black;
        background: #f8f8f8;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .media-box.tall {
        height: 280px;
      }

      .media-box.short {
        height: 220px;
      }

      .media-box.board-box {
        height: 170px;
      }

      .top-diagram-card {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .media-box.top-diagram-box {
        flex: 1;
        height: auto;
        min-height: 0;
      }

      .datapath-overlay-box {
        position: relative;
        width: 100%;
        height: 360px;
        border: 2px solid black;
        background: #f8f8f8;
        overflow: hidden;
      }

      .datapath-overlay-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0.36;
      }

      .datapath-overlay-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .datapath-overlay-text {
        font-size: 12px;
        fill: #111827;
        font-weight: 700;
      }

      .flow-mix-card {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .flow-chain {
        --flow-chain-padding: 12px;
        --flow-chain-gap: 4px;
        --flow-step-min-h: 42px;
        --flow-step-pad-y: 8px;
        --flow-step-pad-right: 10px;
        --flow-step-pad-left: 38px;
        --flow-font-size: 11px;
        --flow-line-height: 1.24;
        --flow-text-lines: 2;
        --flow-box-flex: 1;
        --flow-arrow-flex: 0.16;
        --flow-index-size: 18px;
        --flow-index-font: 10px;
        --flow-index-left: 9px;
        --flow-index-border: 2px;
        --flow-arrow-stem-w: 3px;
        --flow-arrow-stem-h: 9px;
        --flow-arrow-head-w: 6px;
        --flow-arrow-head-h: 7px;
        display: flex;
        flex-direction: column;
        gap: var(--flow-chain-gap);
        min-height: 0;
        overflow: hidden;
        padding: var(--flow-chain-padding);
        border: 2px solid #000000;
        background: #ffffff;
        box-shadow: 6px 6px 0 rgba(0, 0, 0, 1);
        border-radius: 0;
        counter-reset: flow-step;
        scrollbar-width: thin;
        scrollbar-color: #9ca3af transparent;
      }

      .flow-chain::-webkit-scrollbar {
        width: 6px;
      }

      .flow-chain::-webkit-scrollbar-track {
        background: transparent;
      }

      .flow-chain::-webkit-scrollbar-thumb {
        background: #9ca3af;
        border: 1px solid #000000;
      }

      .flow-step-box {
        position: relative;
        flex: var(--flow-box-flex) 1 0;
        border: 2px solid #000000;
        background: #f4f4f5;
        min-height: 0;
        padding: var(--flow-step-pad-y) var(--flow-step-pad-right) var(--flow-step-pad-y)
          var(--flow-step-pad-left);
        display: flex;
        align-items: center;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 1);
        border-radius: 0;
        counter-increment: flow-step;
      }

      .flow-step-box::before {
        content: counter(flow-step);
        position: absolute;
        left: var(--flow-index-left);
        top: 50%;
        transform: translateY(-50%);
        width: var(--flow-index-size);
        height: var(--flow-index-size);
        border: var(--flow-index-border) solid #000000;
        background: #000000;
        color: #ffffff;
        font-size: var(--flow-index-font);
        font-weight: 900;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0;
      }

      .flow-step-box::after {
        content: none;
      }

      .flow-step-text {
        margin: 0;
        font-size: var(--flow-font-size);
        line-height: var(--flow-line-height);
        font-weight: 700;
        color: #111111;
        overflow: hidden;
        word-break: break-word;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: var(--flow-text-lines);
      }

      .flow-step-arrow {
        flex: var(--flow-arrow-flex) 1 0;
        min-height: 0;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .flow-step-arrow::before {
        content: "";
        width: var(--flow-arrow-stem-w);
        height: var(--flow-arrow-stem-h);
        background: #000000;
      }

      .flow-step-arrow::after {
        content: "";
        width: 0;
        height: 0;
        border-left: var(--flow-arrow-head-w) solid transparent;
        border-right: var(--flow-arrow-head-w) solid transparent;
        border-top: var(--flow-arrow-head-h) solid #000000;
      }

      .flow-split-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        flex: 1;
        min-height: 0;
      }

      .flow-split-col {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .flow-split-col .flow-chain {
        flex: 1;
        min-height: 0;
      }

      .flow-split-title {
        margin: 0 0 6px 0;
        padding: 4px 12px 4px 16px;
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        border: 2px solid #000000;
        background: #ffffff;
        color: #000000;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.7px;
        border-radius: 0;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 1);
        position: relative;
      }

      .flow-split-title::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 5px;
        background: var(--primary-brand);
      }

      .path-flow-grid {
        flex: 1;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr);
        align-content: stretch;
      }

      .path-flow-grid > .card {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .path-flow-grid .flow-mix-card .flow-chain {
        flex: 1;
      }

      .path-flow-grid .flow-step-box {
        min-height: 0;
      }

      .path-flow-grid .flow-step-arrow {
        height: auto;
      }

      .path-flow-grid .datapath-overlay-box {
        flex: 1;
        min-height: 0;
        height: auto;
      }

      .media-box img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .media-box .empty-label {
        display: none;
        margin: 0 18px;
        text-align: center;
        font-size: 13px;
        line-height: 1.45;
        color: #666;
      }

      .media-box.is-empty {
        background: repeating-linear-gradient(
          -45deg,
          #f3f4f6,
          #f3f4f6 12px,
          #e5e7eb 12px,
          #e5e7eb 24px
        );
      }

      .media-box.is-empty img {
        display: none;
      }

      .media-box.is-empty .empty-label {
        display: block;
      }

      .media-caption {
        margin-top: 8px;
        text-align: center;
        color: #666;
        font-size: 13px;
      }

      .split-meta {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .meta-pill {
        border: 2px solid black;
        background: #f8fafc;
        padding: 10px;
        font-size: 13px;
        font-weight: 700;
      }

      .module-role-card .split-meta {
        margin-top: 12px;
      }

      .module-role-card .meta-pill {
        min-height: 120px;
        display: flex;
        align-items: flex-start;
      }

      .module-no-fsm-role,
      .module-parent-role {
        padding: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .module-no-fsm-role .split-meta,
      .module-parent-role .split-meta {
        margin-top: 8px;
        gap: 8px;
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
        grid-template-rows: minmax(0, 1fr);
      }

      .module-no-fsm-role .meta-pill,
      .module-parent-role .meta-pill {
        min-height: 0;
        height: 100%;
        padding: 8px;
        font-size: 11px;
        line-height: 1.25;
        display: flex;
        align-items: flex-start;
      }

      .module-no-fsm-role .module-role-input-box,
      .module-parent-role .module-role-input-box {
        min-height: 34px;
        padding: 6px 8px;
        font-size: 11px;
        flex: 0 0 auto;
      }

      .module-no-fsm-role .module-summary-grid,
      .module-parent-role .module-summary-grid {
        gap: 6px;
        margin-top: 6px;
      }

      .module-no-fsm-role .module-summary-box,
      .module-parent-role .module-summary-box {
        min-height: 64px;
        padding: 6px;
      }

      .module-no-fsm-role .module-summary-title,
      .module-parent-role .module-summary-title {
        font-size: 10px;
      }

      .module-no-fsm-role .module-summary-text,
      .module-parent-role .module-summary-text {
        font-size: 10px;
      }

      .module-role-input-box {
        width: 100%;
        min-height: 40px;
        border: 2px solid black;
        background: #ffffff;
        color: #111827;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.35;
        padding: 8px 10px;
        overflow: hidden;
      }

      .module-summary-grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        min-height: 0;
      }

      .module-summary-box {
        border: 2px solid black;
        background: #ffffff;
        padding: 8px;
        min-height: 72px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .module-summary-title {
        margin: 0;
        font-size: 11px;
        font-weight: 900;
        color: #111827;
      }

      .module-summary-text {
        margin: 0;
        font-size: 11px;
        line-height: 1.35;
        color: #111827;
        font-weight: 700;
      }

      .module-detail-grid {
        height: 100%;
        min-height: 0;
      }

      .module-left-col,
      .module-right-col {
        min-height: 0;
      }

      .module-simple-card {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .module-fsm-card {
        flex: 1;
        min-height: 0;
      }

      .module-fsm-card {
        flex: 0 0 auto;
      }

      .media-box.module-simple-box {
        height: 220px;
      }

      .media-box.module-simple-box img {
        max-width: 96%;
        max-height: 94%;
      }

      .module-simple-card .media-box.module-simple-box {
        flex: 1;
        min-height: 0;
        height: auto;
      }

      .module-simple-card .media-caption {
        margin-top: 4px;
      }

      .media-box.module-fsm-box {
        height: 160px;
      }

      .module-role-card,
      .module-state-card {
        min-height: 0;
      }

      .module-state-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 250px;
      }

      .module-viz-placeholder-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 250px;
      }

      .module-viz-placeholder {
        flex: 1;
        min-height: 0;
        border: 2px dashed #111827;
        background: repeating-linear-gradient(
          -45deg,
          #f3f4f6,
          #f3f4f6 12px,
          #e5e7eb 12px,
          #e5e7eb 24px
        );
      }

      .module-detail-grid.no-fsm-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 14px;
        align-content: stretch;
      }

      .module-no-fsm-simple .media-box.module-simple-box {
        height: 185px;
      }

      .module-no-fsm-viz {
        grid-column: 1 / -1;
        min-height: 0;
      }

      .module-detail-grid.parent-module-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: minmax(0, 1.05fr) minmax(0, 0.95fr);
        gap: 12px;
        align-content: stretch;
      }

      .module-detail-grid.no-fsm-layout .module-viz-placeholder-card,
      .module-detail-grid.parent-module-layout .module-viz-placeholder-card {
        min-height: 256px;
        padding: 12px;
      }

      .module-child-module-card {
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 10px;
        background: #f8f8f8;
        overflow: hidden;
      }

      .module-child-module-card h3 {
        margin-bottom: 4px;
        font-size: 13px;
      }

      .child-module-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(var(--child-grid-rows, 4), minmax(0, 1fr));
        gap: var(--child-grid-gap, 2px);
        margin-top: 2px;
        min-height: 0;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .child-module-item {
        border: 2px solid black;
        background: linear-gradient(90deg, var(--primary-brand) 0 4px, #ffffff 4px 100%);
        padding: var(--child-item-padding, 1px 4px);
        min-height: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.95);
      }

      .child-module-name {
        margin: 0;
        width: 100%;
        font-size: var(--child-name-size, 8px);
        font-weight: 900;
        line-height: var(--child-name-line-height, 1.1);
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        color: #111827;
        letter-spacing: 0.1px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .module-parent-viz {
        grid-column: 1 / -1;
        min-height: 0;
        margin-top: 2px;
      }

      .module-parent-note {
        margin-top: 8px;
        font-size: 12px;
        color: #374151;
      }

      .state-content {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      .state-content ul {
        margin: 0;
        padding-left: 18px;
      }

      .state-content li {
        margin-bottom: 5px;
      }

      .state-size-lg {
        font-size: 14px;
        line-height: 1.5;
      }

      .state-size-md {
        font-size: 13px;
        line-height: 1.45;
      }

      .state-size-sm {
        font-size: 12px;
        line-height: 1.4;
      }

      .state-size-xs {
        font-size: 11px;
        line-height: 1.35;
      }

      .report-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .report-util-card {
        margin-top: 12px;
      }

      .report-panel {
        min-height: 255px;
      }

      .report-slide .report-grid {
        gap: 12px;
      }

      .report-slide .report-panel {
        min-height: 180px;
        overflow: auto;
      }

      .report-slide .report-grid .report-panel {
        min-height: 170px;
        height: 170px;
        max-height: 170px;
      }

      .report-slide .report-grid .report-panel .power-visual {
        padding: 6px;
      }

      .report-slide .report-grid .report-panel .power-visual-title {
        margin: 0 0 4px 0;
        font-size: 11px;
      }

      .report-slide .report-grid .report-panel .power-visual-layout {
        grid-template-columns: 44px 44px 1fr;
        gap: 6px;
      }

      .report-slide .report-grid .report-panel .power-stack {
        height: 118px;
      }

      .report-slide .report-grid .report-panel .power-segment-label {
        font-size: 10px;
      }

      .report-slide .report-grid .report-panel .power-legend {
        padding: 4px 5px;
        gap: 2px;
      }

            team: ensureText(safeCover.team, ensureText(safeMeta.team, "TEAM")),
            titleLine1,
            titleLine2,
            subtitle: ensureText(safeCover.subtitle, subtitleFallback),
            dateLabel: ensureText(safeCover.dateLabel, "Date"),
            authorLabel: ensureText(safeCover.authorLabel, "Author"),
            date: ensureText(safeMeta.date, ""),
            author: ensureText(safeMeta.author, "")
          };
        }

        function renderHeader(chapterTag, title, chapterNumber) {
          return `
            <span class="chapter-number">${escapeHtml(chapterNumber)}</span>
            <header class="slide-header">
              <span class="chapter-tag">${escapeHtml(chapterTag)}</span>
              <h1>${escapeHtml(title)}</h1>
            </header>
          `;
        }

        function renderBulletList(items) {
          return items.map((item) => `<li>${escapeHtml(item)}</li>`).join("");
        }

        function toOptionalBoxCount(value) {
          if (value === null || value === undefined || String(value).trim() === "") return null;
          const parsed = Number(value);
          if (!Number.isFinite(parsed)) return null;
          return Math.max(0, Math.floor(parsed));
        }

        function buildFlowSteps(rawItems, fallbackItems, boxCount, labelPrefix) {
          const normalized = Array.isArray(rawItems)
            ? rawItems
                .map((item) => String(item || "").trim())
                .filter((item) => item.length > 0)
            : [];
          if (boxCount === null) {
            return normalized.length > 0 ? normalized : fallbackItems;
          }
          if (boxCount === 0) return [];
          const result = normalized.slice(0, boxCount);
          for (let idx = result.length; idx < boxCount; idx += 1) {
            result.push(`[Input Needed] ${labelPrefix} #${idx + 1}`);
          }
          return result;
        }

        function resolveFlowChainStyle(stepCount) {
          const count = Math.max(1, Number(stepCount) || 1);
          let preset;
          if (count <= 4) {
            preset = {
              chainPadding: 12,
              gap: 4,
              minHeight: 42,
              padY: 8,
              padRight: 10,
              padLeft: 38,
              fontSize: 11,
              lineHeight: 1.24,
              textLines: 2,
              boxFlex: 1,
              arrowFlex: 0.16,
              indexSize: 18,
              indexFont: 10,
              indexLeft: 9,
              indexBorder: 2,
              arrowStemW: 3,
              arrowStemH: 9,
              arrowHeadW: 6,
              arrowHeadH: 7
            };
          } else if (count <= 6) {
            preset = {
              chainPadding: 10,
              gap: 3,
              minHeight: 34,
              padY: 6,
              padRight: 9,
              padLeft: 34,
              fontSize: 10.2,
              lineHeight: 1.18,
              textLines: 2,
              boxFlex: 1,
              arrowFlex: 0.13,
              indexSize: 16,
              indexFont: 9,
              indexLeft: 8,
              indexBorder: 2,
              arrowStemW: 3,
              arrowStemH: 8,
              arrowHeadW: 5,
              arrowHeadH: 6
            };
          } else if (count <= 8) {
            preset = {
              chainPadding: 8,
              gap: 2,
              minHeight: 28,
              padY: 4,
              padRight: 8,
              padLeft: 30,
              fontSize: 9.2,
              lineHeight: 1.14,
              textLines: 2,
              boxFlex: 1,
              arrowFlex: 0.1,
              indexSize: 14,
              indexFont: 8,
              indexLeft: 7,
              indexBorder: 2,
              arrowStemW: 2,
              arrowStemH: 6,
              arrowHeadW: 5,
              arrowHeadH: 5
            };
          } else if (count <= 10) {
            preset = {
              chainPadding: 7,
              gap: 1,
              minHeight: 24,
              padY: 3,
              padRight: 7,
              padLeft: 27,
              fontSize: 8.3,
              lineHeight: 1.1,
              textLines: 1,
              boxFlex: 1,
              arrowFlex: 0.08,
              indexSize: 13,
              indexFont: 7,
              indexLeft: 6,
              indexBorder: 1,
              arrowStemW: 2,
              arrowStemH: 5,
              arrowHeadW: 4,
              arrowHeadH: 4
            };
          } else if (count <= 12) {
            preset = {
              chainPadding: 6,
              gap: 1,
              minHeight: 20,
              padY: 2,
              padRight: 6,
              padLeft: 24,
              fontSize: 7.7,
              lineHeight: 1.05,
              textLines: 1,
              boxFlex: 1,
              arrowFlex: 0.06,
              indexSize: 11,
              indexFont: 6.5,
              indexLeft: 6,
              indexBorder: 1,
              arrowStemW: 2,
              arrowStemH: 4,
              arrowHeadW: 3,
              arrowHeadH: 3
            };
          } else {
            preset = {
              chainPadding: 5,
              gap: 1,
              minHeight: 16,
              padY: 1,
              padRight: 5,
              padLeft: 21,
              fontSize: 7,
              lineHeight: 1,
              textLines: 1,
              boxFlex: 1,
              arrowFlex: 0.05,
              indexSize: 10,
              indexFont: 6,
              indexLeft: 5,
              indexBorder: 1,
              arrowStemW: 1,
              arrowStemH: 3,
              arrowHeadW: 3,
              arrowHeadH: 3
            };
          }
          return [
            `--flow-chain-padding:${preset.chainPadding}px`,
            `--flow-chain-gap:${preset.gap}px`,
            `--flow-step-min-h:${preset.minHeight}px`,
            `--flow-step-pad-y:${preset.padY}px`,
            `--flow-step-pad-right:${preset.padRight}px`,
            `--flow-step-pad-left:${preset.padLeft}px`,
            `--flow-font-size:${preset.fontSize}px`,
            `--flow-line-height:${preset.lineHeight}`,
            `--flow-text-lines:${preset.textLines}`,
            `--flow-box-flex:${preset.boxFlex}`,
            `--flow-arrow-flex:${preset.arrowFlex}`,
            `--flow-index-size:${preset.indexSize}px`,
            `--flow-index-font:${preset.indexFont}px`,
            `--flow-index-left:${preset.indexLeft}px`,
            `--flow-index-border:${preset.indexBorder}px`,
            `--flow-arrow-stem-w:${preset.arrowStemW}px`,
            `--flow-arrow-stem-h:${preset.arrowStemH}px`,
            `--flow-arrow-head-w:${preset.arrowHeadW}px`,
            `--flow-arrow-head-h:${preset.arrowHeadH}px`
          ].join(";");
        }

        function renderFlowChain(items) {
          const steps = Array.isArray(items) ? items : [];
          return steps
            .map((item, idx) => {
              const arrowHtml = idx < steps.length - 1 ? '<div class="flow-step-arrow" aria-hidden="true"></div>' : "";
              return `
                <div class="flow-step-box">
                  <p class="flow-step-text">${escapeHtml(item)}</p>
                </div>
                ${arrowHtml}
              `;
            })
            .join("");
        }

        function renderMediaBox(src, altText, caption, boxClass = "media-box") {
          const normalizedSrc = String(src || "").trim();
          const hasSrc = normalizedSrc.length > 0;
          const safeAlt = escapeHtml(altText);
          const safeCaption = escapeHtml(caption || "");
          const safeSrc = escapeHtml(normalizedSrc);
          const emptyLabel = hasSrc
            ? `파일을 찾을 수 없습니다: ${safeSrc}`
            : "링크를 입력하면 이미지가 이 영역에 표시됩니다.";

          return `
            <div class="${boxClass}${hasSrc ? "" : " is-empty"}">
              ${hasSrc ? `<img src="${safeSrc}" alt="${safeAlt}" loading="lazy" />` : ""}
              <p class="empty-label">${emptyLabel}</p>
            </div>
            ${safeCaption ? `<p class="media-caption">${safeCaption}</p>` : ""}
          `;
        }

        function buildSlides(config) {
          const safeConfig = isPlainObject(config) ? config : {};
          const metaConfig = isPlainObject(safeConfig.meta) ? safeConfig.meta : {};
          const assets = isPlainObject(safeConfig.assets) ? safeConfig.assets : {};
          const modules = Array.isArray(safeConfig.modules) ? safeConfig.modules : [];
          const moduleCount = modules.filter((item) => {
            const safeItem = isPlainObject(item) ? item : {};
            const kind = String(safeItem.slideKind || "module").trim().toLowerCase();
            return kind !== "testbench";
          }).length;
          const coverMeta = resolveCoverMeta(metaConfig);
          const coverTitleHtml = coverMeta.titleLine2
            ? `${escapeHtml(coverMeta.titleLine1)}<br />${escapeHtml(coverMeta.titleLine2)}`
            : escapeHtml(coverMeta.titleLine1);
          const featureSource = Array.isArray(safeConfig.featurePlaceholders) ? safeConfig.featurePlaceholders : [];
          const normalizedFeatures =
            featureSource.length > 0
              ? featureSource.map((feature, idx) => {
                  if (typeof feature === "string") {
                    return {
                      title: `기능 블록 #${idx + 1}`,
                      description: ensureText(feature, "[입력 필요] 기능 설명을 입력하세요.")
                    };
                  }
                  const safeFeature = isPlainObject(feature) ? feature : {};
                  return {
                    title: ensureText(safeFeature.title, `기능 블록 #${idx + 1}`),
                    description: ensureText(safeFeature.description, "[입력 필요] 기능 설명을 입력하세요.")
                  };
                })
              : [
                  {
                    title: "기능 블록 #1",
                    description: "[입력 필요] 기능 항목을 입력하세요."
                  }
                ];
          const featureItems = normalizedFeatures
            .map(
              (feature, idx) => `
                <div class="feature-item">
                  <strong>${idx + 1}. ${escapeHtml(feature.title)}</strong>
                  <p>${escapeHtml(feature.description)}</p>
                </div>
              `
            )
            .join("");
          const env = isPlainObject(safeConfig.developmentEnvironment) ? safeConfig.developmentEnvironment : {};
          const osText = ensureText(env.os, "-");
          const tools = Array.isArray(env.tools)
            ? env.tools.filter((item) => String(item || "").trim().length > 0)
            : [];
          const languages = Array.isArray(env.language)
            ? env.language.filter((item) => String(item || "").trim().length > 0)
            : [];
          const toolsText = tools.length > 0 ? tools.join(", ") : "-";
          const languageText = languages.length > 0 ? languages.join(", ") : "-";
          const constraints = Array.isArray(safeConfig.constraints)
            ? safeConfig.constraints.filter((item) => String(item || "").trim().length > 0)
            : [];
          const constraintsHtml = renderBulletList(
            constraints.length > 0
              ? constraints
              : ["[입력 필요] 제약 조건 목록을 constraints 배열에 입력하세요."]
          );

          const timingNotes = Array.isArray(safeConfig.timingNotes)
            ? safeConfig.timingNotes.filter((item) => String(item || "").trim().length > 0)
            : [];
          const timingNotesHtml = renderBulletList(
            timingNotes.length > 0
              ? timingNotes
              : ["[Input Needed] Fill timingNotes array for this memo section."]
          );

          const defaultDatapathFlow = [
            "[Input Needed] Datapath step #1",
            "[Input Needed] Datapath step #2",
            "[Input Needed] Datapath step #3"
          ];
          const defaultClockFlow = [
            "[Input Needed] CLK step #1",
            "[Input Needed] CLK step #2",
            "[Input Needed] CLK step #3"
          ];
          const defaultResetFlow = [
            "[Input Needed] RESET step #1",
            "[Input Needed] RESET step #2",
            "[Input Needed] RESET step #3"
          ];

          const rawDatapathFlowSteps = Array.isArray(safeConfig.datapathFlowSteps)
            ? safeConfig.datapathFlowSteps
            : [];
          const rawClockFlowSteps = Array.isArray(safeConfig.clockFlowSteps) ? safeConfig.clockFlowSteps : [];
          const rawResetFlowSteps = Array.isArray(safeConfig.resetFlowSteps) ? safeConfig.resetFlowSteps : [];
          const rawClockResetFlowSteps = Array.isArray(safeConfig.clockResetFlowSteps)
            ? safeConfig.clockResetFlowSteps
            : [];

          const datapathFlowBoxCount = toOptionalBoxCount(safeConfig.datapathFlowBoxCount);
          const clockFlowBoxCount = toOptionalBoxCount(safeConfig.clockFlowBoxCount);
          const resetFlowBoxCount = toOptionalBoxCount(safeConfig.resetFlowBoxCount);
          const clockResetFlowBoxCount = toOptionalBoxCount(safeConfig.clockResetFlowBoxCount);

          const legacySplitIndex = Math.ceil(rawClockResetFlowSteps.length / 2);
          const legacyClockFlow = rawClockResetFlowSteps.slice(0, legacySplitIndex);
          const legacyResetFlow = rawClockResetFlowSteps.slice(legacySplitIndex);
          const legacyClockBoxCount =
            clockResetFlowBoxCount === null ? null : Math.ceil(clockResetFlowBoxCount / 2);
          const legacyResetBoxCount =
            clockResetFlowBoxCount === null ? null : Math.floor(clockResetFlowBoxCount / 2);

          const datapathFlowSteps = buildFlowSteps(
            rawDatapathFlowSteps,
            defaultDatapathFlow,
            datapathFlowBoxCount,
            "Datapath step"
          );
          const clockFlowSource = rawClockFlowSteps.length > 0 ? rawClockFlowSteps : legacyClockFlow;
          const resetFlowSource = rawResetFlowSteps.length > 0 ? rawResetFlowSteps : legacyResetFlow;
          const effectiveClockFlowBoxCount =
            clockFlowBoxCount !== null
              ? clockFlowBoxCount
              : rawClockFlowSteps.length > 0
                ? null
                : legacyClockBoxCount;
          const effectiveResetFlowBoxCount =
            resetFlowBoxCount !== null
              ? resetFlowBoxCount
              : rawResetFlowSteps.length > 0
                ? null
                : legacyResetBoxCount;
          const clockFlowSteps = buildFlowSteps(
            clockFlowSource,
            defaultClockFlow,
            effectiveClockFlowBoxCount,
            "CLK step"
          );
          const resetFlowSteps = buildFlowSteps(
            resetFlowSource,
            defaultResetFlow,
            effectiveResetFlowBoxCount,
            "RESET step"
          );

          const datapathFlowHtml = renderFlowChain(datapathFlowSteps);
          const clockFlowHtml = renderFlowChain(clockFlowSteps);
          const resetFlowHtml = renderFlowChain(resetFlowSteps);
          const datapathFlowStyle = resolveFlowChainStyle(datapathFlowSteps.length);
          const clockFlowStyle = resolveFlowChainStyle(clockFlowSteps.length);
          const resetFlowStyle = resolveFlowChainStyle(resetFlowSteps.length);

          const conclusionPoints = Array.isArray(safeConfig.conclusionPoints)
            ? safeConfig.conclusionPoints.filter((item) => String(item || "").trim().length > 0)
            : [];
          const conclusionPointsHtml = renderBulletList(
            conclusionPoints.length > 0
              ? conclusionPoints
              : ["[Input Needed] Fill conclusionPoints array."]
          );
          const conclusionNextSteps = Array.isArray(safeConfig.conclusionNextSteps)
            ? safeConfig.conclusionNextSteps.filter((item) => String(item || "").trim().length > 0)
            : [];
          const conclusionNextStepsHtml = renderBulletList(
            conclusionNextSteps.length > 0
              ? conclusionNextSteps
              : ["[Input Needed] Fill conclusionNextSteps array."]
          );

          const moduleSlides = (() => {
            let moduleDetailIndex = 0;
            let testbenchIndex = 0;
            return modules
              .map((module, idx) => {
                const safeModule = isPlainObject(module) ? module : {};
                const moduleName =
                  String(safeModule.name || "").trim() || `MODULE_${String(idx + 1).padStart(2, "0")}`;
                const slideKind = String(safeModule.slideKind || "module").trim().toLowerCase();

                if (slideKind === "testbench") {
                  testbenchIndex += 1;
                  const linkedModule = ensureText(safeModule.linkedModule, moduleName);
                  const tbWave = ensureText(
                    safeModule.testbenchWaveform,
                    ensureText(assets.testbenchWaveform, "")
                  );
                  const tbFiles = Array.isArray(safeModule.testbenchFiles)
                    ? safeModule.testbenchFiles.filter((item) => String(item || "").trim().length > 0)
                    : [];
                  const tbChecks = Array.isArray(safeModule.testbenchChecks)
                    ? safeModule.testbenchChecks.filter((item) => String(item || "").trim().length > 0)
                    : [];
                  const tbFileListHtml =
                    tbFiles.length > 0
                      ? `<ul>${renderBulletList(tbFiles)}</ul>`
                      : "<p>[Input Needed] testbenchFiles 를 입력하세요.</p>";
                  const tbChecksHtml = renderBulletList(
                    tbChecks.length > 0
                      ? tbChecks
                      : [
                          "[Input Needed] Reset/Startup check",
                          "[Input Needed] Main datapath/control check",
                          "[Input Needed] Boundary/error handling check"
                        ]
                  );

                  return `
                    <section>
                      <div class="slide-frame">
                        ${renderHeader("Testbench", `7-${testbenchIndex}. ${linkedModule}`, "07")}
                        <div class="col-flex testbench-layout">
                          <div class="card testbench-wave-card">
                            <h3>Waveform</h3>
                            ${renderMediaBox(
                              tbWave,
                              `${linkedModule} testbench waveform`,
                              "",
                              "media-box tall"
                            )}
                          </div>
                          <div class="grid-2">
                            <div class="card">
                              <h3>Linked Module</h3>
                              <p>${escapeHtml(linkedModule)}</p>
                              <h3 style="margin-top:10px;">Testbench Files</h3>
                              ${tbFileListHtml}
                            </div>
                            <div class="card accent testbench-check-card">
                              <h3>Verification Checks</h3>
                              <ul>${tbChecksHtml}</ul>
                            </div>
                          </div>
                        </div>
                      </div>
                    </section>
                  `;
                }

                moduleDetailIndex += 1;
                const roleText = String(safeModule.role || "").trim();
                const summaryItems = Array.isArray(safeModule.summary)
                  ? safeModule.summary.filter((item) => String(item || "").trim().length > 0)
                  : [];
                const summaryLeft = summaryItems.length > 0 ? summaryItems[0] : "[Input Needed] Summary #1";
                const summaryRight =
                  summaryItems.length > 1
                    ? summaryItems.slice(1).join(" / ")
                    : "[Input Needed] Summary #2";
                const simpleDiagramSvg = ensureText(safeModule.simpleDiagramSvg, "");
                const fsmImage = ensureText(safeModule.fsmImage, "");
                const hasFsmImage = fsmImage.length > 0;
                const detailLayout = String(safeModule.detailLayout || "").trim().toLowerCase();
                const hasChildModules = Array.isArray(safeModule.childModules) && safeModule.childModules.length > 0;
                const isParentModuleLayout = detailLayout === "parent-module" || hasChildModules;
                const isFsmModuleLayout = !isParentModuleLayout && (detailLayout === "fsm-module" || hasFsmImage);
                const stateItems = Array.isArray(safeModule.stateDescription)
                  ? safeModule.stateDescription.filter((item) => String(item || "").trim().length > 0)
                  : [];
                const stateFontClass =
                  stateItems.length <= 4
                    ? "state-size-lg"
                    : stateItems.length <= 7
                      ? "state-size-md"
                      : stateItems.length <= 10
                        ? "state-size-sm"
                        : "state-size-xs";
                const stateHtml =
                  stateItems.length > 0
                    ? `<div class="state-content ${stateFontClass}"><ul>${renderBulletList(stateItems)}</ul></div>`
                    : `<div class="state-content state-size-md"><p>[Input Needed] FSM state description을 입력하세요.</p></div>`;
                const childModules = Array.isArray(safeModule.childModules)
                  ? safeModule.childModules.filter((item) => item !== null && item !== undefined)
                  : [];
                const childModuleCount = childModules.length;
                const childRowCount = Math.max(1, Math.ceil(childModuleCount / 2));
                const childLayoutPreset =
                  childRowCount <= 2
                    ? { nameSizePx: 11, gapPx: 4, itemPadding: "3px 6px", lineHeight: 1.2 }
                    : childRowCount === 3
                      ? { nameSizePx: 10, gapPx: 3, itemPadding: "2px 5px", lineHeight: 1.15 }
                      : childRowCount === 4
                        ? { nameSizePx: 9, gapPx: 2, itemPadding: "2px 4px", lineHeight: 1.1 }
                        : childRowCount <= 6
                          ? { nameSizePx: 8, gapPx: 2, itemPadding: "1px 3px", lineHeight: 1.05 }
                          : { nameSizePx: 7, gapPx: 1, itemPadding: "1px 2px", lineHeight: 1 };
                const childGridStyle = [
                  `--child-grid-rows:${childRowCount}`,
                  `--child-grid-gap:${childLayoutPreset.gapPx}px`,
                  `--child-item-padding:${childLayoutPreset.itemPadding}`,
                  `--child-name-size:${childLayoutPreset.nameSizePx}px`,
                  `--child-name-line-height:${childLayoutPreset.lineHeight}`
                ].join(";");
                const childModulesHtml =
                  childModuleCount > 0
                    ? `<div class="child-module-grid" style="${childGridStyle}">${childModules
                        .map((child, childIdx) => {
                          if (typeof child === "string") {
                            return `<div class="child-module-item"><p class="child-module-name">${escapeHtml(child)}</p></div>`;
                          }
                          const childName = String(child.name || "").trim() || `sub_module_${childIdx + 1}`;
                          return `<div class="child-module-item"><p class="child-module-name">${escapeHtml(childName)}</p></div>`;
                        })
                        .join("")}</div>`
                    : `<p>[Input Needed] childModules 목록을 입력하세요.</p>`;
                const roleCardBody = `
                  <h3>Module Role</h3>
                  <div class="module-role-input-box">${escapeHtml(roleText || "[Input Needed] Role description")}</div>
                  <div class="module-summary-grid">
                    <div class="module-summary-box">
                      <p class="module-summary-title">Summary 1</p>
                      <p class="module-summary-text">${escapeHtml(summaryLeft)}</p>
                    </div>
                    <div class="module-summary-box">
                      <p class="module-summary-title">Summary 2</p>
                      <p class="module-summary-text">${escapeHtml(summaryRight)}</p>
                    </div>
                  </div>
                `;
                const simpleCardHtml = `
                  <div class="card module-simple-card">
                    <h3>Block Diagram</h3>
                    ${renderMediaBox(
                      simpleDiagramSvg,
                      `${moduleName} simple diagram`,
                      "",
                      "media-box module-simple-box"
                    )}
                  </div>
                `;
                const fsmLayoutHtml = `
                  <div class="col-flex module-left-col">
                    ${simpleCardHtml}
                    <div class="card accent module-role-card">
                      ${roleCardBody}
                    </div>
                  </div>
                  <div class="col-flex module-right-col">
                    <div class="card module-fsm-card">
                      <h3>FSM</h3>
                      ${renderMediaBox(
                        fsmImage,
                        `${moduleName} FSM`,
                        "fsmImage 경로를 입력하세요.",
                        "media-box module-fsm-box"
                      )}
                    </div>
                    <div class="card module-state-card">
                      <h3>STATE</h3>
                      ${stateHtml}
                    </div>
                  </div>
                `;
                const noFsmLayoutHtml = `
                  <div class="card module-simple-card module-no-fsm-simple">
                    <h3>Block Diagram</h3>
                    ${renderMediaBox(
                      simpleDiagramSvg,
                      `${moduleName} simple diagram`,
                      "",
                      "media-box module-simple-box"
                    )}
                  </div>
                  <div class="card accent module-role-card module-no-fsm-role">
                    ${roleCardBody}
                  </div>
                  <div class="card module-viz-placeholder-card module-no-fsm-viz">
                    <h3>INFOGRAPHIC</h3>
                    <div class="module-viz-placeholder"></div>
                  </div>
                `;
                const parentModuleLayoutHtml = `
                  <div class="card accent module-role-card module-parent-role">
                    ${roleCardBody}
                  </div>
                  <div class="card module-child-module-card">
                    <h3>Sub-module Structure</h3>
                    ${childModulesHtml}
                  </div>
                  <div class="card module-viz-placeholder-card module-parent-viz">
                    <h3>Hierarchy Visualization</h3>
                    <div class="module-viz-placeholder"></div>
                  </div>
                `;
                const moduleLayoutClass = isFsmModuleLayout
                  ? "grid-2 module-detail-grid"
                  : isParentModuleLayout
                    ? "module-detail-grid parent-module-layout"
                    : "module-detail-grid no-fsm-layout";
                const moduleLayoutHtml = isFsmModuleLayout
                  ? fsmLayoutHtml
                  : isParentModuleLayout
                    ? parentModuleLayoutHtml
                    : noFsmLayoutHtml;

                return `
                  <section>
                    <div class="slide-frame">
                      ${renderHeader(
                        "Module Detail",
                        `6-${moduleDetailIndex}. ${moduleName}`,
                        "06"
                      )}
                      <div class="${moduleLayoutClass}">
                        ${moduleLayoutHtml}
                      </div>
                    </div>
                  </section>
                `;
              })
              .join("");
          })();
          const troubleCases = Array.isArray(safeConfig.troubleShootings)
            ? safeConfig.troubleShootings.filter((item) => item !== null && item !== undefined)
            : [];
          const normalizedTroubleCases =
            troubleCases.length > 0
              ? troubleCases
              : [
                  {
