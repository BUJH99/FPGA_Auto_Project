<svg xmlns="http://www.w3.org/2000/svg" width="560" height="630">
  <style>
    text {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: black;
    }
    .module-name {
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
    }
    .port-label {
      font-size: 12px;
    }
    .box {
      fill: white;
      stroke: black;
      stroke-width: 2;
    }
    .wire {
      stroke: black;
      stroke-width: 2;
      fill: none;
    }
    .arrow {
      fill: black;
    }
  </style>
  
  <!-- Module Box -->
  <rect class="box" x="150" y="50" width="260" height="530"/>
  
  <!-- Module Name -->
  <text class="module-name" x="280" y="550">ControlUnit</text>
    <!-- Input: iClk -->
  <line class="wire" x1="118" y1="90" x2="150" y2="90"/>
  <polygon class="arrow" points="143,86 150,90 143,94"/>
  <text class="port-label" x="160" y="94">iClk</text>
    <!-- Input: iRst -->
  <line class="wire" x1="118" y1="115" x2="150" y2="115"/>
  <polygon class="arrow" points="143,111 150,115 143,119"/>
  <text class="port-label" x="160" y="119">iRst</text>
    <!-- Input: iTick1kHz -->
  <line class="wire" x1="118" y1="140" x2="150" y2="140"/>
  <polygon class="arrow" points="143,136 150,140 143,144"/>
  <text class="port-label" x="160" y="144">iTick1kHz</text>
    <!-- Input: iMode[1:0] -->
  <line class="wire" x1="118" y1="165" x2="150" y2="165"/>
  <polygon class="arrow" points="143,161 150,165 143,169"/>
  <text class="port-label" x="160" y="169">iMode[1:0]</text>
    <!-- Input: iCmdValid -->
  <line class="wire" x1="118" y1="190" x2="150" y2="190"/>
  <polygon class="arrow" points="143,186 150,190 143,194"/>
  <text class="port-label" x="160" y="194">iCmdValid</text>
    <!-- Input: iCmdCode[4:0] -->
  <line class="wire" x1="118" y1="215" x2="150" y2="215"/>
  <polygon class="arrow" points="143,211 150,215 143,219"/>
  <text class="port-label" x="160" y="219">iCmdCode[4:0]</text>
    <!-- Input: iEcho -->
  <line class="wire" x1="118" y1="240" x2="150" y2="240"/>
  <polygon class="arrow" points="143,236 150,240 143,244"/>
  <text class="port-label" x="160" y="244">iEcho</text>
    <!-- Output: oTrig -->
  <line class="wire" x1="410" y1="90" x2="442" y2="90"/>
  <polygon class="arrow" points="435,86 442,90 435,94"/>
  <text class="port-label" text-anchor="end" x="400" y="94">oTrig</text>
    <!-- Output: oWatchData[15:0] -->
  <line class="wire" x1="410" y1="115" x2="442" y2="115"/>
  <polygon class="arrow" points="435,111 442,115 435,119"/>
  <text class="port-label" text-anchor="end" x="400" y="119">oWatchData[15:0]</text>
    <!-- Output: oWatchFullData[31:0] -->
  <line class="wire" x1="410" y1="140" x2="442" y2="140"/>
  <polygon class="arrow" points="435,136 442,140 435,144"/>
  <text class="port-label" text-anchor="end" x="400" y="144">oWatchFullData[31:0]</text>
    <!-- Output: oWatchBlinkMask[3:0] -->
  <line class="wire" x1="410" y1="165" x2="442" y2="165"/>
  <polygon class="arrow" points="435,161 442,165 435,169"/>
  <text class="port-label" text-anchor="end" x="400" y="169">oWatchBlinkMask[3:0]</text>
    <!-- Output: oWatchDotMask[3:0] -->
  <line class="wire" x1="410" y1="190" x2="442" y2="190"/>
  <polygon class="arrow" points="435,186 442,190 435,194"/>
  <text class="port-label" text-anchor="end" x="400" y="194">oWatchDotMask[3:0]</text>
    <!-- Output: oWatchEditActive -->
  <line class="wire" x1="410" y1="215" x2="442" y2="215"/>
  <polygon class="arrow" points="435,211 442,215 435,219"/>
  <text class="port-label" text-anchor="end" x="400" y="219">oWatchEditActive</text>
    <!-- Output: oStopData[15:0] -->
  <line class="wire" x1="410" y1="240" x2="442" y2="240"/>
  <polygon class="arrow" points="435,236 442,240 435,244"/>
  <text class="port-label" text-anchor="end" x="400" y="244">oStopData[15:0]</text>
    <!-- Output: oStopFullData[31:0] -->
  <line class="wire" x1="410" y1="265" x2="442" y2="265"/>
  <polygon class="arrow" points="435,261 442,265 435,269"/>
  <text class="port-label" text-anchor="end" x="400" y="269">oStopFullData[31:0]</text>
    <!-- Output: oStopBlinkMask[3:0] -->
  <line class="wire" x1="410" y1="290" x2="442" y2="290"/>
  <polygon class="arrow" points="435,286 442,290 435,294"/>
  <text class="port-label" text-anchor="end" x="400" y="294">oStopBlinkMask[3:0]</text>
    <!-- Output: oStopDotMask[3:0] -->
  <line class="wire" x1="410" y1="315" x2="442" y2="315"/>
  <polygon class="arrow" points="435,311 442,315 435,319"/>
  <text class="port-label" text-anchor="end" x="400" y="319">oStopDotMask[3:0]</text>
    <!-- Output: oStopEditActive -->
  <line class="wire" x1="410" y1="340" x2="442" y2="340"/>
  <polygon class="arrow" points="435,336 442,340 435,344"/>
  <text class="port-label" text-anchor="end" x="400" y="344">oStopEditActive</text>
    <!-- Output: oHcsr04Distance[15:0] -->
  <line class="wire" x1="410" y1="365" x2="442" y2="365"/>
  <polygon class="arrow" points="435,361 442,365 435,369"/>
  <text class="port-label" text-anchor="end" x="400" y="369">oHcsr04Distance[15:0]</text>
    <!-- Output: oHcsr04Valid -->
  <line class="wire" x1="410" y1="390" x2="442" y2="390"/>
  <polygon class="arrow" points="435,386 442,390 435,394"/>
  <text class="port-label" text-anchor="end" x="400" y="394">oHcsr04Valid</text>
    <!-- Output: oHcsr04AutoRun -->
  <line class="wire" x1="410" y1="415" x2="442" y2="415"/>
  <polygon class="arrow" points="435,411 442,415 435,419"/>
  <text class="port-label" text-anchor="end" x="400" y="419">oHcsr04AutoRun</text>
    <!-- Output: oDht11Temp[15:0] -->
  <line class="wire" x1="410" y1="440" x2="442" y2="440"/>
  <polygon class="arrow" points="435,436 442,440 435,444"/>
  <text class="port-label" text-anchor="end" x="400" y="444">oDht11Temp[15:0]</text>
    <!-- Output: oDht11Humi[15:0] -->
  <line class="wire" x1="410" y1="465" x2="442" y2="465"/>
  <polygon class="arrow" points="435,461 442,465 435,469"/>
  <text class="port-label" text-anchor="end" x="400" y="469">oDht11Humi[15:0]</text>
    <!-- Output: oDht11Valid -->
  <line class="wire" x1="410" y1="490" x2="442" y2="490"/>
  <polygon class="arrow" points="435,486 442,490 435,494"/>
  <text class="port-label" text-anchor="end" x="400" y="494">oDht11Valid</text>
    <!-- Output: oDht11AutoRun -->
  <line class="wire" x1="410" y1="515" x2="442" y2="515"/>
  <polygon class="arrow" points="435,511 442,515 435,519"/>
  <text class="port-label" text-anchor="end" x="400" y="519">oDht11AutoRun</text>
  </svg>
