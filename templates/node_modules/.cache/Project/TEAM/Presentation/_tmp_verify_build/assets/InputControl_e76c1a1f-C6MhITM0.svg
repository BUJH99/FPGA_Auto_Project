<svg xmlns="http://www.w3.org/2000/svg" width="560" height="530">
  <style>
    text {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: black;
    }
    .module-name {
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
    }
    .port-label {
      font-size: 12px;
    }
    .box {
      fill: white;
      stroke: black;
      stroke-width: 2;
    }
    .wire {
      stroke: black;
      stroke-width: 2;
      fill: none;
    }
    .arrow {
      fill: black;
    }
  </style>
  
  <!-- Module Box -->
  <rect class="box" x="150" y="50" width="260" height="430"/>
  
  <!-- Module Name -->
  <text class="module-name" x="280" y="450">InputControl</text>
    <!-- Input: iClk -->
  <line class="wire" x1="118" y1="90" x2="150" y2="90"/>
  <polygon class="arrow" points="143,86 150,90 143,94"/>
  <text class="port-label" x="160" y="94">iClk</text>
    <!-- Input: iRst -->
  <line class="wire" x1="118" y1="115" x2="150" y2="115"/>
  <polygon class="arrow" points="143,111 150,115 143,119"/>
  <text class="port-label" x="160" y="119">iRst</text>
    <!-- Input: iBtnPulseFpga[4:0] -->
  <line class="wire" x1="118" y1="140" x2="150" y2="140"/>
  <polygon class="arrow" points="143,136 150,140 143,144"/>
  <text class="port-label" x="160" y="144">iBtnPulseFpga[4:0]</text>
    <!-- Input: iSwLevelFpga[2:0] -->
  <line class="wire" x1="118" y1="165" x2="150" y2="165"/>
  <polygon class="arrow" points="143,161 150,165 143,169"/>
  <text class="port-label" x="160" y="169">iSwLevelFpga[2:0]</text>
    <!-- Input: iBtnPulsePc[4:0] -->
  <line class="wire" x1="118" y1="190" x2="150" y2="190"/>
  <polygon class="arrow" points="143,186 150,190 143,194"/>
  <text class="port-label" x="160" y="194">iBtnPulsePc[4:0]</text>
    <!-- Input: iSw1PulsePc -->
  <line class="wire" x1="118" y1="215" x2="150" y2="215"/>
  <polygon class="arrow" points="143,211 150,215 143,219"/>
  <text class="port-label" x="160" y="219">iSw1PulsePc</text>
    <!-- Input: iSw2PulsePc -->
  <line class="wire" x1="118" y1="240" x2="150" y2="240"/>
  <polygon class="arrow" points="143,236 150,240 143,244"/>
  <text class="port-label" x="160" y="244">iSw2PulsePc</text>
    <!-- Input: iSw3PulsePc -->
  <line class="wire" x1="118" y1="265" x2="150" y2="265"/>
  <polygon class="arrow" points="143,261 150,265 143,269"/>
  <text class="port-label" x="160" y="269">iSw3PulsePc</text>
    <!-- Input: iReqFndPc -->
  <line class="wire" x1="118" y1="290" x2="150" y2="290"/>
  <polygon class="arrow" points="143,286 150,290 143,294"/>
  <text class="port-label" x="160" y="294">iReqFndPc</text>
    <!-- Input: iReqStatePc -->
  <line class="wire" x1="118" y1="315" x2="150" y2="315"/>
  <polygon class="arrow" points="143,311 150,315 143,319"/>
  <text class="port-label" x="160" y="319">iReqStatePc</text>
    <!-- Input: iReqStopwatchPc -->
  <line class="wire" x1="118" y1="340" x2="150" y2="340"/>
  <polygon class="arrow" points="143,336 150,340 143,344"/>
  <text class="port-label" x="160" y="344">iReqStopwatchPc</text>
    <!-- Input: iReqWatchPc -->
  <line class="wire" x1="118" y1="365" x2="150" y2="365"/>
  <polygon class="arrow" points="143,361 150,365 143,369"/>
  <text class="port-label" x="160" y="369">iReqWatchPc</text>
    <!-- Input: iReqHcsr04Pc -->
  <line class="wire" x1="118" y1="390" x2="150" y2="390"/>
  <polygon class="arrow" points="143,386 150,390 143,394"/>
  <text class="port-label" x="160" y="394">iReqHcsr04Pc</text>
    <!-- Input: iReqDht11Pc -->
  <line class="wire" x1="118" y1="415" x2="150" y2="415"/>
  <polygon class="arrow" points="143,411 150,415 143,419"/>
  <text class="port-label" x="160" y="419">iReqDht11Pc</text>
    <!-- Output: oMode[1:0] -->
  <line class="wire" x1="410" y1="90" x2="442" y2="90"/>
  <polygon class="arrow" points="435,86 442,90 435,94"/>
  <text class="port-label" text-anchor="end" x="400" y="94">oMode[1:0]</text>
    <!-- Output: oModeLock -->
  <line class="wire" x1="410" y1="115" x2="442" y2="115"/>
  <polygon class="arrow" points="435,111 442,115 435,119"/>
  <text class="port-label" text-anchor="end" x="400" y="119">oModeLock</text>
    <!-- Output: oCmdValid -->
  <line class="wire" x1="410" y1="140" x2="442" y2="140"/>
  <polygon class="arrow" points="435,136 442,140 435,144"/>
  <text class="port-label" text-anchor="end" x="400" y="144">oCmdValid</text>
    <!-- Output: oCmdCode[4:0] -->
  <line class="wire" x1="410" y1="165" x2="442" y2="165"/>
  <polygon class="arrow" points="435,161 442,165 435,169"/>
  <text class="port-label" text-anchor="end" x="400" y="169">oCmdCode[4:0]</text>
  </svg>
