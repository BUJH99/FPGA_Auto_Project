version: "1"
project:
  name: "vivado_xsim_example"
hdl:
  top: "top"
  src_globs:
    - "src/**/*.sv"
    - "src/**/*.v"
  tb_globs:
    - "tb/**/*.sv"
    - "tb/**/*.v"
  inc_globs:
    - "include/**/*.svh"
    - "include/**/*.vh"
  xdc_globs:
    - "constrs/**/*.xdc"
  exclude_globs:
    - "src/legacy/**"
sim:
  tool: "xsim"
  timescale: "1ns/1ps"
vivado:
  board: "Ultra96v2"
  board_part: "Avnet-tria:Ultra96v2:part0:1.3"
  part: "xczu3eg-sbva484-1-i"
  strategy: "Default"
report:
  enable: true
  format: "html"
